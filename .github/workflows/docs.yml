name: docs

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 8 am
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # To push the refreshed badges to the cache branch.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out the cache branch
        uses: actions/checkout@v7
        with:
          ref: cache
          path: cache-branch
      - name: Restore cached badges
        run: |
          mkdir -p doc/_static/cache
          cp -r cache-branch/doc/_static/cache/. doc/_static/cache/
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Build badges
        run: uv run python tools/build_badges.py
      - name: Push badges to the cache branch
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        working-directory: cache-branch
        run: |
          mkdir -p doc/_static/cache
          cp -r ../doc/_static/cache/. doc/_static/cache/
          git config user.name github-actions
          git config user.email github-actions@github.com
          # The cache directory is gitignored.
          git add -f doc/_static/cache
          if git diff --cached --quiet; then
            echo "No badge changed"
          else
            git commit -m "adding cached badges"
            git push origin HEAD:cache
          fi
      - name: Build website
        run: uv run sphinx-build -W -b html doc builtdocs
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: builtdocs

  deploy:
    needs: [lint, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: builtdocs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./builtdocs
          cname: pyviz.org
          force_orphan: true
