[project]
name = "pyviz-org"
version = "0.0.0"
description = "Source material to build pyviz.org"
requires-python = ">=3.14"
dependencies = [
    "colorcet>=3.2.1",
    "jinja2>=3.1.6",
    "markdown>=3.11",
    "myst-parser>=5.1.0",
    "polars>=1.44.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sphinx>=9.1.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
# The tools scripts import each other as top-level modules.
src = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
